<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon exposé : toutes les matières</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=IBM+Plex+Serif:wght@400;500&display=swap">
<style>
:root{--bg:#EDF2F6;--grid:#D3DEE7;--ink:#13213B;--mute:#4A5A75;--focus:#2457F5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1726;--grid:#1A2940;--ink:#E6EDF7;--mute:#9AABC4;--focus:#7FA0FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1726;--grid:#1A2940;--ink:#E6EDF7;--mute:#9AABC4;--focus:#7FA0FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;color:var(--ink);font:400 1.05rem/1.65 "IBM Plex Serif",Georgia,serif}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}
h1,h2,h3,nav,dt{font-family:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif}
nav{display:flex;gap:.25rem;overflow-x:auto;padding:.75rem 0;border-bottom:2px solid var(--ink)}
nav a{flex:none;padding:.5rem .8rem;color:var(--ink);text-decoration:none;font-weight:500}
nav a.on{background:var(--ink);color:var(--bg)}
a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1{font-size:clamp(2.4rem,9vw,5rem);line-height:1;font-weight:800;letter-spacing:-.03em;margin:2.5rem 0 1rem;max-width:13ch}
h2{font-size:clamp(2.2rem,8vw,4rem);line-height:1;font-weight:800;letter-spacing:-.02em;margin:2rem 0 .75rem;display:flex;align-items:center;gap:.9rem}
h3{font-size:1.25rem;margin:0 0 .3rem}
.lead{max-width:40rem;color:var(--mute);font-size:1.15rem}
.dot{display:inline-block;flex:none;border-radius:50%;background:var(--c);border:2px solid var(--ink)}
.list{margin:2rem 0 1rem;border-top:3px solid var(--ink)}
.row{display:grid;grid-template-columns:3.4rem 1fr;gap:.2rem 1rem;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--ink);color:inherit;text-decoration:none}
.row .sz{display:flex;justify-content:center}
.row h3{margin:0}
.row p{margin:0;color:var(--mute);font-size:.95rem;grid-column:2}
.row b{font:500 .95rem "Bricolage Grotesque",sans-serif;grid-column:2}
.note{color:var(--mute);font-size:.9rem;max-width:40rem}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));margin:1.5rem 0;border-top:3px solid var(--ink)}
dl div{padding:.6rem .8rem .6rem 0;border-bottom:1px solid var(--ink)}
dt{font-size:.9rem;color:var(--mute)}
dd{margin:0;font:800 1.2rem "Bricolage Grotesque",sans-serif}
.topic{display:grid;grid-template-columns:1fr;gap:.2rem 2rem;padding:1.1rem 0;border-top:1px solid var(--ink)}
.topic p{margin:0;max-width:42rem}
@media (min-width:760px){.topic{grid-template-columns:15rem 1fr}.row{grid-template-columns:3.4rem 10rem 1fr;}.row b{grid-column:auto;text-align:right}.row p{grid-column:auto}}
.page{display:none;padding-bottom:3rem}.page.on{display:block}
.back{display:inline-block;margin-top:1rem;padding:.5rem 0;color:var(--ink);font:500 1rem "Bricolage Grotesque",sans-serif}
.pn{display:flex;justify-content:space-between;gap:1rem;border-top:2px solid var(--ink);margin-top:1.5rem;padding-top:1rem;font-family:"Bricolage Grotesque",sans-serif;font-weight:500}
.pn a{color:var(--ink)}
footer{border-top:2px solid var(--ink);padding:1rem 0 2rem;color:var(--mute);font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.page.on{animation:in .3s ease-out}}
@keyframes in{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
<nav id="nav" aria-label="Pages"></nav>
<main id="main"></main>
<footer>Pour aller plus loin, vérifie ces informations dans tes manuels.</footer>
</div>
<script>var S=[
{id:"maths",n:"Maths",c:"#2E7BD6",i:"Nombres, géométrie et calculs : les outils pour résoudre des problèmes.",t:[
["Nombres premiers","Un nombre premier a exactement deux diviseurs : 1 et lui-même. Par exemple 2, 3, 5, 7 et 11. Le nombre 1 n’est pas premier, et 2 est le seul nombre premier pair."],
["Angles et triangles","La somme des angles d’un triangle est toujours égale à 180°. Un triangle rectangle a un angle de 90°."],
["Théorème de Pythagore","Dans un triangle rectangle, le carré de l’hypoténuse (le côté le plus long) est égal à la somme des carrés des deux autres côtés : a² + b² = c²."],
["Périmètres et aires","Rectangle : aire = longueur × largeur. Cercle de rayon r : périmètre = 2 × π × r et aire = π × r². Le nombre π vaut environ 3,14."],
["Pourcentages","Un pourcentage est une proportion sur 100. Pour trouver 20 % de 50, on calcule 50 × 20 ÷ 100 = 10."]]},
{id:"francais",n:"Français",c:"#C1440E",i:"Les règles de la langue : mots, phrases, conjugaison et orthographe.",t:[
["Les classes de mots","Les principales sont le nom, le déterminant, l’adjectif, le pronom, le verbe, l’adverbe, la préposition et la conjonction. Les prépositions et les conjonctions ne changent jamais de forme."],
["La phrase","Une phrase simple contient un seul verbe conjugué ; une phrase complexe en contient plusieurs. Il y a quatre types de phrases : déclarative, interrogative, injonctive (l’ordre) et exclamative."],
["Le passé composé","Il se forme avec l’auxiliaire avoir ou être au présent, suivi du participe passé : « j’ai mangé », « elle est partie ». Avec être, le participe passé s’accorde avec le sujet."],
["Homophones à connaître","« a » est le verbe avoir (on peut dire « avait ») et « à » est une préposition. « et » relie deux mots, alors que « est » est le verbe être (on peut dire « était »)."]]},
{id:"histoire",n:"Histoire",c:"#8C5A2B",i:"Les grandes périodes, des Gaulois au XXe siècle.",t:[
["L’Antiquité","Jules César conquiert la Gaule. En 52 avant J.-C., le chef gaulois Vercingétorix est vaincu à Alésia, et la Gaule devient romaine."],
["Le Moyen Âge","On le situe souvent entre la chute de l’Empire romain d’Occident (476) et 1492. Charlemagne est couronné empereur en l’an 800."],
["La Révolution française","Elle commence en 1789. Le 14 juillet 1789, le peuple prend la Bastille. En août 1789, la Déclaration des droits de l’homme et du citoyen proclame la liberté et l’égalité en droits. La Première République est proclamée en 1792."],
["Les guerres mondiales","La Première Guerre mondiale dure de 1914 à 1918, la Seconde de 1939 à 1945."]]},
{id:"geographie",n:"Géographie",c:"#1F8A5B",i:"La Terre, ses continents, ses océans et ses pays.",t:[
["Continents et océans","Selon les modèles, on compte 5, 6 ou 7 continents. Il y a cinq océans : Pacifique, Atlantique, Indien, Austral et Arctique. Le Pacifique est le plus grand."],
["La France","Elle compte environ 68 millions d’habitants et sa capitale est Paris. La France métropolitaine est découpée en 13 régions, auxquelles s’ajoutent les territoires d’outre-mer."],
["Des records","La Russie est le plus grand pays par sa superficie. L’Inde et la Chine ont chacune plus de 1,4 milliard d’habitants. L’Everest, à 8 849 m, est le plus haut sommet du monde, et le Sahara est le plus grand désert chaud."],
["Lire une carte","L’échelle indique le rapport entre une distance sur la carte et la distance réelle. La latitude se mesure à partir de l’équateur (0°), la longitude à partir du méridien de Greenwich (0°)."]]},
{id:"anglais",n:"Anglais",c:"#7B3FE4",i:"Les bases de la grammaire anglaise.",t:[
["Les pronoms","I, you, he, she, it, we, you, they. « It » remplace une chose ou un animal."],
["Le verbe « to be »","I am, you are, he/she/it is, we are, you are, they are."],
["Le présent simple","On ajoute -s à la 3e personne du singulier : « she plays ». Pour la négation, on utilise do not (don’t) ou does not (doesn’t) : « he doesn’t play »."],
["Le prétérit","Les verbes réguliers prennent -ed : « played ». Les verbes irréguliers changent : go → went, have → had, see → saw."]]}
];
var L=["Diamètre moyen","Distance au Soleil","Une année","Un tour sur elle-même","Température","Lunes"];
function sz(p){return(0.5+parseFloat(p.k[0].replace(/\s/g,""))/139820*2.5).toFixed(2)}
var nav=document.getElementById("nav"),main=document.getElementById("main");
nav.innerHTML='<a href="#accueil" data-id="accueil">Accueil</a>'+S.concat([{id:"planetes",n:"Planètes"}]).map(function(p){return'<a href="#'+p.id+'" data-id="'+p.id+'">'+p.n+'</a>'}).join("");
var h='<section class="page" id="p-accueil"><h1>Toutes les matières en un site</h1><p class="lead">Choisis une matière pour revoir les notions clés.</p><div class="list">';
S.concat([{id:"planetes",n:"Sciences : les planètes",c:"#3E54E8",i:"Les huit planètes du système solaire, de la taille à l’exploration."}]).forEach(function(s){h+='<a class="row" href="#'+s.id+'"><span class="sz"><span class="dot" style="--c:'+s.c+';width:1.6rem;height:1.6rem"></span></span><h3>'+s.n+'</h3><p>'+s.i+'</p></a>'});
h+='</div></section><section class="page" id="p-planetes"><a class="back" href="#accueil">← Retour à l’accueil</a><h2>Les planètes</h2><p class="lead">Huit planètes tournent autour du Soleil. Choisis-en une pour tout savoir sur elle.</p><div class="list">';
P.forEach(function(p){h+='<a class="row" href="#'+p.id+'"><span class="sz"><span class="dot" style="--c:'+p.c+';width:'+sz(p)+'rem;height:'+sz(p)+'rem"></span></span><h3>'+p.n+'</h3><p>'+p.ty+'. '+p.i+'</p><b>'+p.k[1]+'</b></a>'});
h+='</div><p class="note">Les disques sont classés par taille, mais pas à l’échelle exacte. 1 UA (unité astronomique) est la distance Terre-Soleil. Pluton n’est plus une planète depuis 2006 : c’est une planète naine. Nombres de lunes : chiffres NASA de 2026, qui augmentent avec les découvertes.</p></section>';
P.forEach(function(p,j){
var a=P[j-1],b=P[j+1];
h+='<section class="page" id="p-'+p.id+'"><a class="back" href="#planetes">← Retour aux planètes</a><h2><span class="dot" style="--c:'+p.c+';width:2.4rem;height:2.4rem"></span>'+p.n+'</h2><p class="lead">'+p.ty+'. '+p.i+'</p><dl>';
p.k.forEach(function(v,m){h+='<div><dt>'+L[m]+'</dt><dd>'+v+'</dd></div>'});
h+='</dl>';
p.t.forEach(function(t){h+='<div class="topic"><h3>'+t[0]+'</h3><p>'+t[1]+'</p></div>'});
h+='<a class="back" href="#planetes">← Retour aux planètes</a><div class="pn"><span>'+(a?'<a href="#'+a.id+'">← '+a.n+'</a>':'')+'</span><span>'+(b?'<a href="#'+b.id+'">'+b.n+' →</a>':'')+'</span></div></section>'});
S.forEach(function(s){h+='<section class="page" id="p-'+s.id+'"><a class="back" href="#accueil">← Retour à l’accueil</a><h2><span class="dot" style="--c:'+s.c+';width:2.4rem;height:2.4rem"></span>'+s.n+'</h2><p class="lead">'+s.i+'</p>';s.t.forEach(function(t){h+='<div class="topic"><h3>'+t[0]+'</h3><p>'+t[1]+'</p></div>'});h+='</section>'});
main.innerHTML=h;
function show(){
var id=location.hash.slice(1)||"accueil";
if(!document.getElementById("p-"+id))id="accueil";
document.querySelectorAll(".page").forEach(function(e){e.classList.toggle("on",e.id==="p-"+id)});
var nid=P.some(function(p){return p.id===id})?"planetes":id;nav.querySelectorAll("a").forEach(function(a){a.classList.toggle("on",a.dataset.id===nid)});
window.scrollTo(0,0);
}
window.addEventListener("hashchange",show);show();
</script>
</body>
</html>
